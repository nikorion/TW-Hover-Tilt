name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # TiddlyWiki resolves the plugin name "nikorion/hover-tilt" through
      # TIDDLYWIKI_PLUGIN_PATH (a dir of symlinks, one per plugin) — same mechanism as
      # locally. Recreate the symlinks of the nikorion plugins the wiki loads so the build
      # resolves them off-machine.
      - name: Set up plugin symlink
        run: |
          mkdir -p "$RUNNER_TEMP/tw-plugins/nikorion"
          ln -s "$GITHUB_WORKSPACE/src/hover-tilt" "$RUNNER_TEMP/tw-plugins/nikorion/hover-tilt"
          # The dev wiki also loads nikorion/detect-language (browser language
          # detection + detect-language-lingo, used by the Playground): fetch it.
          git clone --depth 1 https://github.com/nikorion/TW-Detect-Language "$RUNNER_TEMP/TW-Detect-Language"
          ln -s "$RUNNER_TEMP/TW-Detect-Language/src/detect-language" "$RUNNER_TEMP/tw-plugins/nikorion/detect-language"
          echo "TIDDLYWIKI_PLUGIN_PATH=$RUNNER_TEMP/tw-plugins" >> "$GITHUB_ENV"

      - run: pnpm build
